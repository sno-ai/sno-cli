name: Public candidate installer smoke

on:
  workflow_call:
    inputs:
      plan:
        description: The cargo-dist release plan.
        required: true
        type: string
      tag:
        description: The one-use public candidate release tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/release-installer-verify.yml
    with:
      mode: candidate
      tag: ${{ inputs.tag }}
    secrets: inherit
