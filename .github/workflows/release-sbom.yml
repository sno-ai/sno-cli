name: Release SBOM

on:
  workflow_call:
    inputs:
      plan:
        description: The cargo-dist release plan.
        required: true
        type: string

permissions:
  contents: read

jobs:
  cyclonedx:
    name: CycloneDX SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Generate SBOM with verified cargo-cyclonedx 0.5.9
        shell: bash
        run: |
          set -euo pipefail
          archive='cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz'
          base='https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --output "$archive" "$base/$archive"
          printf '%s  %s\n' \
            'fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8' \
            "$archive" | sha256sum --check --strict
          tar -xJf "$archive"
          export PATH="$PWD/cargo-cyclonedx-x86_64-unknown-linux-gnu:$PATH"
          cargo cyclonedx -v
          mkdir artifacts
          sbom="$(find . -name '*.cdx.xml' -type f -print -quit)"
          test -n "$sbom"
          cp "$sbom" artifacts/sno.cdx.xml
          (cd artifacts && sha256sum sno.cdx.xml > sno.cdx.xml.sha256)

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-sbom
          path: artifacts/*
