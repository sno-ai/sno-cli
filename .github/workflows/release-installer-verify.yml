name: Release installer verification

on:
  workflow_call:
    inputs:
      mode:
        description: "Artifact source: staged, draft, candidate, or public."
        required: true
        type: string
      tag:
        description: "Release tag override for public candidate verification."
        required: false
        default: ""
        type: string
      release_id:
        description: "Numeric draft release ID for authenticated asset download."
        required: false
        default: ""
        type: string

jobs:
  installer:
    name: ${{ inputs.mode }} installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            archive: sno-x86_64-unknown-linux-gnu.tar.gz
            script: sno-installer.sh
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            archive: sno-aarch64-unknown-linux-gnu.tar.gz
            script: sno-installer.sh
          - name: macOS Intel
            os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            archive: sno-x86_64-apple-darwin.tar.gz
            script: sno-installer.sh
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            archive: sno-aarch64-apple-darwin.tar.gz
            script: sno-installer.sh
          - name: Windows x64
            os: windows-2022
            arch: X64
            target: x86_64-pc-windows-msvc
            archive: sno-x86_64-pc-windows-msvc.zip
            script: sno-installer.ps1
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate verification mode
        shell: bash
        run: |
          case '${{ inputs.mode }}' in
            staged|draft|candidate|public) ;;
            *) echo 'unsupported installer verification mode' >&2; exit 1 ;;
          esac

      - name: Download staged installer
        if: inputs.mode == 'staged'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-build-global
          path: artifacts

      - name: Download staged archive
        if: inputs.mode == 'staged'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: artifacts

      - name: Download exact draft assets from GitHub
        if: inputs.mode == 'draft'
        env:
          DRAFT_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]
          mkdir artifacts
          assets="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}/assets?per_page=100")"
          for asset_name in '${{ matrix.archive }}' '${{ matrix.script }}'; do
            asset_id="$(jq -er --arg name "$asset_name" '
              [.[] | select(.name == $name)]
              | if length == 1 then .[0].id else error("expected exactly one matching asset") end
            ' <<<"$assets" | tr -d '\r')"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            gh api \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "artifacts/${asset_name}"
            test -s "artifacts/${asset_name}"
          done

      - name: Install and execute on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          export CARGO_HOME="$(mktemp -d)"
          if [[ '${{ inputs.mode }}' = public || '${{ inputs.mode }}' = candidate ]]; then
            if [[ '${{ inputs.mode }}' = candidate ]]; then
              export SNO_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            fi
            installer="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ matrix.script }}"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$installer" | sh
          else
            export SNO_DOWNLOAD_URL="file://$PWD/artifacts"
            sh "artifacts/${{ matrix.script }}"
          fi
          binary="$CARGO_HOME/bin/sno"
          "$binary" --version | grep -Eq '^sno [0-9]+\.[0-9]+\.[0-9]+'
          help="$($binary --help)"
          for command in account station starport; do
            grep -Eq "^[[:space:]]+$command" <<<"$help"
          done
          profile="$(mktemp -d)"
          test "$(SNO_PROFILE_DIR="$profile" "$binary" station telemetry consent get --json)" = '{"consent":"metadata-only"}'

      - name: Install and execute on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($observed -ne '${{ matrix.arch }}') { throw "expected ${{ matrix.arch }}, observed $observed" }
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          if ('${{ inputs.mode }}' -eq 'public' -or '${{ inputs.mode }}' -eq 'candidate') {
            if ('${{ inputs.mode }}' -eq 'candidate') {
              $env:SNO_DOWNLOAD_URL = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
            }
            $installer = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/${{ matrix.script }}"
            Invoke-RestMethod $installer | Invoke-Expression
          } else {
            $artifactPath = (Resolve-Path artifacts).Path
            $env:SNO_DOWNLOAD_URL = ([System.Uri]::new($artifactPath + [System.IO.Path]::DirectorySeparatorChar)).AbsoluteUri.TrimEnd('/')
            & "artifacts/${{ matrix.script }}"
          }
          $binary = Join-Path $env:CARGO_HOME 'bin/sno.exe'
          if ((& $binary --version) -notmatch '^sno \d+\.\d+\.\d+') { throw 'unexpected version output' }
          $help = (& $binary --help) -join "`n"
          foreach ($command in @('account', 'station', 'starport')) {
            if ($help -notmatch "(?m)^\s+$command") { throw "missing command: $command" }
          }
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $profile | Out-Null
          $env:SNO_PROFILE_DIR = $profile
          $consent = & $binary station telemetry consent get --json | ConvertFrom-Json
          if ($consent.consent -ne 'metadata-only') { throw 'unexpected fresh-profile consent' }
