# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
# SECURITY HARDENED: repository-pinned tool hashes and the pre-host installer
# gate are maintained locally because cargo-dist 0.32.0 cannot express them.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: scripts/install-cargo-dist.sh
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  custom-release-preflight:
    uses: ./.github/workflows/release-preflight.yml
    secrets: inherit

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - custom-release-preflight
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: scripts/install-cargo-dist.sh
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  custom-release-archive-smoke:
    needs:
      - plan
      - build-local-artifacts
    uses: ./.github/workflows/release-archive-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  custom-release-sbom:
    needs:
      - plan
      - build-local-artifacts
    uses: ./.github/workflows/release-sbom.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  custom-release-installer-smoke:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - custom-release-archive-smoke
      - custom-release-sbom
    uses: ./.github/workflows/release-installer-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - custom-release-archive-smoke
      - custom-release-sbom
      - custom-release-installer-smoke
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.custom-release-archive-smoke.result == 'skipped' || needs.custom-release-archive-smoke.result == 'success') && (needs.custom-release-sbom.result == 'skipped' || needs.custom-release-sbom.result == 'success') && needs.custom-release-installer-smoke.result == 'success' && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
      draft_id: ${{ steps.create_release.outputs.release_id }}
    permissions:
      "attestations": "write"
      "contents": "write"
      "id-token": "write"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: |
            artifacts/*
      - name: Create GitHub Release
        id: create_release
        env:
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          set -euo pipefail
          resolved_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq '.sha')"
          test "$resolved_commit" = "$GITHUB_SHA" || {
            echo "release tag moved: expected $GITHUB_SHA, found $resolved_commit" >&2
            exit 1
          }
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          mapfile -t draft_ids < <(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id")
          test "${#draft_ids[@]}" -eq 1
          echo "release_id=${draft_ids[0]}" >> "$GITHUB_OUTPUT"

  custom-release-draft-installer-smoke:
    needs:
      - plan
      - host
    uses: ./.github/workflows/release-draft-installer-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      release_id: ${{ needs.host.outputs.draft_id }}
    secrets: inherit

  host-public-candidate:
    needs:
      - plan
      - host
      - custom-release-draft-installer-smoke
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_ID: ${{ needs.host.outputs.draft_id }}
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Publish one-use public candidate from verified draft assets
        id: candidate
        env:
          FINAL_TAG: "${{ needs.plan.outputs.tag }}"
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="sno-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]
          mkdir artifacts
          assets="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}/assets?per_page=100")"
          mapfile -t asset_rows < <(jq -r '.[] | [.id, .name] | @tsv' <<<"$assets")
          test "${#asset_rows[@]}" -gt 0
          for row in "${asset_rows[@]}"; do
            IFS=$'\t' read -r asset_id asset_name <<<"$row"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            [[ "$asset_name" != */* && "$asset_name" != .* ]]
            gh api \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "artifacts/${asset_name}"
            test -s "artifacts/${asset_name}"
          done
          gh release create "$candidate_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SNO public install candidate ${GITHUB_RUN_ID}" \
            --notes "One-use public candidate for anonymous installer verification." \
            artifacts/*
          immutable="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${candidate_tag}" \
            --jq '.immutable')"
          test "$immutable" = "true"

  custom-release-candidate-installer-smoke:
    needs:
      - plan
      - host-public-candidate
    uses: ./.github/workflows/release-candidate-installer-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      tag: ${{ needs.host-public-candidate.outputs.tag }}
    secrets: inherit

  cleanup-public-candidate:
    needs:
      - host-public-candidate
      - custom-release-candidate-installer-smoke
    if: ${{ always() && needs.host-public-candidate.outputs.tag != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_TAG: ${{ needs.host-public-candidate.outputs.tag }}
    steps:
      - name: Delete one-use public candidate and tag
        shell: bash
        run: |
          set -euo pipefail
          # GitHub permits deleting an immutable release and then its tag. Candidate tags are unique and never reused.
          gh release delete "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${CANDIDATE_TAG}"

  publish-release:
    needs:
      - plan
      - host
      - custom-release-draft-installer-smoke
      - custom-release-candidate-installer-smoke
      - cleanup-public-candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish verified draft as immutable release
        env:
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
          DRAFT_ID: ${{ needs.host.outputs.draft_id }}
        shell: bash
        run: |
          set -euo pipefail
          resolved_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq '.sha')"
          test "$resolved_commit" = "$GITHUB_SHA" || {
            echo "release tag moved: expected $GITHUB_SHA, found $resolved_commit" >&2
            exit 1
          }
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]
          published="$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" \
            -F draft=false)"
          test "$(jq -r '.tag_name' <<<"$published")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$published")" = false

  verify-published-release:
    needs:
      - plan
      - publish-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.verify.outputs.state }}
    steps:
      - name: Verify immutable publication with bounded retries
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "immutable release verification attempt ${attempt}/5"
            if immutable="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${{ needs.plan.outputs.tag }}" \
              --jq '.immutable')"; then
              if [[ "$immutable" = true ]]; then
                echo 'state=immutable' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo 'state=mutable' >> "$GITHUB_OUTPUT"
              echo 'published release is confirmed mutable' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'state=unknown' >> "$GITHUB_OUTPUT"
          echo 'immutable release state remains unknown; retaining release for operator inspection' >&2
          exit 1

  cleanup-confirmed-mutable-release:
    needs:
      - plan
      - host
      - verify-published-release
    if: ${{ always() && needs.host.result == 'success' && needs.verify-published-release.result == 'failure' && needs.verify-published-release.outputs.state == 'mutable' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete confirmed mutable release
        run: gh release delete "${{ needs.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes

  cleanup-failed-draft:
    needs:
      - plan
      - host
      - custom-release-draft-installer-smoke
    if: ${{ always() && needs.host.result == 'success' && needs.custom-release-draft-installer-smoke.result == 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRAFT_ID: ${{ needs.host.outputs.draft_id }}
    steps:
      - name: Delete failed draft without deleting its tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRAFT_ID" =~ ^[0-9]+$ ]]
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}"

  announce:
    needs:
      - plan
      - host
      - verify-published-release
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && needs.verify-published-release.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          submodules: recursive

  custom-release-public-installer-smoke:
    needs:
      - plan
      - announce
    uses: ./.github/workflows/release-public-installer-smoke.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit

  cleanup-failed-public-smoke:
    needs:
      - plan
      - host
      - custom-release-public-installer-smoke
    if: ${{ always() && needs.host.result == 'success' && needs.custom-release-public-installer-smoke.result == 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete release after confirmed public installer failure
        run: gh release delete "${{ needs.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes
