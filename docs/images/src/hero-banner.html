<!doctype html>
<!-- Rendered to ../hero-banner.png at 1600x480, device scale 2. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:480px;overflow:hidden;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
 background:radial-gradient(ellipse 60% 90% at 22% 55%,#0b2a3a 0%,#071423 45%,#04060b 100%);}
.glow{position:absolute;left:120px;top:70px;width:520px;height:360px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(45,212,191,.28),rgba(45,212,191,0));filter:blur(30px)}
.stage{position:absolute;left:150px;top:70px;perspective:1100px}
.term{width:470px;height:300px;border-radius:16px;transform:rotateY(18deg) rotateX(8deg) rotateZ(-2deg);
 background:linear-gradient(160deg,rgba(18,38,56,.92),rgba(6,14,24,.95));
 border:1.5px solid rgba(94,234,212,.55);
 box-shadow:0 0 0 1px rgba(45,212,191,.15),0 0 40px rgba(45,212,191,.35),0 40px 80px rgba(0,0,0,.6);
 padding:18px 22px;font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;font-size:17px;line-height:1.75;color:#cfe3f1}
.dots span{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;background:#34495e}
.dots{margin-bottom:14px}
.p{color:#2dd4bf}.ok{color:#2dd4bf}.dim{color:#7f93a8}.w{color:#ffffff;font-weight:600}
.cursor{display:inline-block;width:10px;height:19px;background:#2dd4bf;vertical-align:-3px;box-shadow:0 0 10px #2dd4bf}
.plane{position:absolute;left:110px;top:330px;width:560px;height:120px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(45,212,191,.22),rgba(45,212,191,0));filter:blur(12px)}
.text{position:absolute;left:760px;top:0;width:820px;height:480px;
 background:linear-gradient(90deg,rgba(8,17,29,0),rgba(5,7,12,.18))}
.kicker{position:absolute;left:0;top:70px;color:#2dd4bf;font-size:17px;font-weight:700;letter-spacing:5.5px}
.h{position:absolute;left:-4px;top:100px;color:#fff;font-size:90px;font-weight:700;letter-spacing:-2.6px}
.s{position:absolute;left:0;top:232px;color:#e6edf3;font-size:30px;letter-spacing:-.25px}
.t{position:absolute;left:0;top:292px;color:#b6c2d1;font-size:22px;font-weight:500}
</style></head><body>
<div class="glow"></div><div class="plane"></div>
<div class="stage"><div class="term">
 <div class="dots"><span></span><span></span><span></span></div>
 <div><span class="p">$</span> <span class="w">sno setup</span></div>
 <div><span class="ok">✓</span> Claude Code <span class="dim">connected</span></div>
 <div><span class="ok">✓</span> Codex <span class="dim">connected</span></div>
 <div><span class="ok">✓</span> shared memory <span class="dim">ready</span></div>
 <div><span class="ok">✓</span> Sno Reach, skills <span class="dim">installed</span></div>
 <div><span class="p">$</span> <span class="cursor"></span></div>
</div></div>
<div class="text">
 <div class="kicker">SNO CLI</div>
 <div class="h">One command.</div>
 <div class="s">Your agents, assembled. Nothing to remember after that.</div>
 <div class="t">Installs Sno Station. Connects every agent. Keeps itself current.</div>
</div>
</body></html>
