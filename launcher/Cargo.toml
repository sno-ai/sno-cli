[package]
name = "sno"
# Equals the Sno CLI release it was published with; scripts/release-cli.sh refuses a release when they differ.
version = "1.1.4"
edition = "2024"
rust-version = "1.85"
description = "The command line for Sno Station, from sno.ai. Installs a small launcher that downloads the latest official sno on first run."
license = "Apache-2.0"
repository = "https://github.com/sno-ai/sno-cli"
homepage = "https://www.sno.ai"
readme = "README.md"
keywords = ["sno", "agents", "claude-code", "codex", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/main.rs", "README.md"]

[[bin]]
name = "sno"
path = "src/main.rs"
